interface:
  display_name: "Connect Welder"
  short_description: "Connect social accounts and start your first workflow"
  default_prompt: "Use $get-started to help me with my Welder social workflow."
dependencies:
  tools:
    - type: "mcp"
      value: "welder"
      description: "Welder social publishing, scheduling and account data"
      transport: "streamable_http"
      url: "https://weldergtm.com/mcp"
policy:
  allow_implicit_invocation: true
